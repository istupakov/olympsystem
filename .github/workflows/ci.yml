name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Check formatting and code style
        run: >
          dotnet format
          --verify-no-changes --no-restore --severity info
          --exclude Olymp.Domain/Migrations

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test --project Olymp.Tests -c Release --no-build

  integration:
    needs: check
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Express
          MSSQL_SA_PASSWORD: Test!Password123
        ports:
          - 1433:1433
        options: >-
          --health-cmd "SQLCMDPASSWORD=$MSSQL_SA_PASSWORD /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s
    env:
      ConnectionStrings__DefaultConnection: Server=localhost,1433;User Id=sa;Password=Test!Password123;TrustServerCertificate=true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Test site with SQL Server
        run: dotnet test --project Olymp.IntegrationTests -c Release

  docker:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build site image
        run: docker build -f Olymp.Site/Dockerfile .
