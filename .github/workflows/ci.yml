name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Check formatting and code style
        run: >
          dotnet format
          --verify-no-changes --no-restore --severity info
          --exclude Olymp.Domain/Migrations

      - name: Build
        run: dotnet build -c Release --no-restore

  docker:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build site image
        run: docker build -f Olymp.Site/Dockerfile .
