services:
  sqlserver:
    environment:
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD for production}
  site:
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: ""
      ASPNETCORE_HTTPS_PORTS: "5000"
      DataProtection__Path: ./keys
      ReverseProxy__KnownProxies__0:
      MailService__UserName:
      MailService__Password:
      ApiKeys__0:
    volumes:
      - ./keys:/app/keys
      - ./tls:/app/tls:ro
    healthcheck:
      test: curl --fail --cacert /app/tls/Olymp.WebApp.crt https://localhost:5000/healthz || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
